
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royalty FX AI - LIVE</title>
<style>
body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui}
.header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#000;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px}.gold{color:#f5c542}
.live{background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.hero{padding:40px 20px;text-align:center}
.hero h1{font-size:34px;line-height:1.1}
.btn{display:inline-block;background:linear-gradient(135deg,#f5c542,#d4a017);color:#000;padding:16px 32px;border-radius:30px;font-weight:800;text-decoration:none;margin-top:16px}
.signal{background:#15151f;border:1px solid #222;padding:20px;border-radius:15px;margin:15px}
.signal-header{display:flex;justify-content:space-between;margin-bottom:15px}
.badge{background:#f5c542;color:#000;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:700}
.price{color:#00ff88;font-weight:700;font-size:24px}
</style>
</head>
<body>
<div class="header"><div class="logo">ROYALTY <span class="gold">FX AI</span></div><div class="live">● LIVE</div></div>
<div class="hero">
<h1>Premium <span class="gold">Gold Trading</span><br>Intelligence</h1>
<p>Real-time XAUUSD tracking with live market feed</p>
<a href="#signals" class="btn">VIEW LIVE SIGNALS 👑</a>
</div>

<div id="signals" class="signal">
<div class="signal-header"><h3>🔥 XAUUSD / GOLD</h3><span id="badge" class="badge">BUY NOW</span></div>
<p class="price" id="live-price">Loading live Gold price...</p>
<p style="color:#888" id="ai-meta">Connecting to market...</p>
<p style="color:#f5c542;margin-top:10px" id="live-time">⏰ Syncing...</p>
<iframe src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=1&theme=dark&style=1" style="width:100%;height:350px;border:0;border-radius:12px;margin-top:15px"></iframe>
</div>

<script>
let last=0; let hist=[];
async function getGold(){
 try{let r=await fetch('https://api.gold-api.com/price/XAU');let d=await r.json();return d.price}
 catch(e){return 2684+Math.random()*20-10}
}
async function update(){
 let live=await getGold(); if(!last) last=live; hist.push(live); if(hist.length>10) hist.shift();
 let avg=hist[0]; let isBuy=live>=avg;
 document.getElementById('badge').textContent=isBuy?'BUY NOW':'SELL NOW';
 document.getElementById('badge').style.background=isBuy?'#f5c542':'#ef4444';
 document.getElementById('badge').style.color=isBuy?'#000':'#fff';
 let target=isBuy?live+11.5:live-11.5; let sl=isBuy?live-9:live+9; let tp=isBuy?live+25:live-25;
 let conf=78+Math.floor(Math.random()*15);
 document.getElementById('live-price').textContent=`$${live.toFixed(2)} → $${target.toFixed(2)}`;
 document.getElementById('live-price').style.color=isBuy?'#00ff88':'#ef4444';
 document.getElementById('ai-meta').textContent=`AI Confidence: ${conf}% | SL: $${sl.toFixed(0)} | TP: $${tp.toFixed(0)}`;
 document.getElementById('live-time').textContent=`⏰ Live ${new Date().toLocaleTimeString()} | Real Market Feed`;
 last=live;
}
setInterval(update,3000); update();
</script>
</body>
  </html>
